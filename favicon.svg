<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="oi">
  <!-- Geometric lowercase "oi" mark; adapts to browser light/dark chrome -->
  <style>
    .mark { color: #111110; }
    @media (prefers-color-scheme: dark) {
      .mark { color: #ffffff; }
    }
  </style>
  <g class="mark">
    <!-- o: outline circle; stroke = stem width = dot diameter -->
    <circle cx="12.875" cy="16" r="7.625" stroke="currentColor" stroke-width="2.75"/>
    <!-- i stem: monoline bar with soft caps -->
    <line x1="26.375" y1="13.375" x2="26.375" y2="23.625"
          stroke="currentColor" stroke-width="2.75" stroke-linecap="round"/>
    <!-- i dot -->
    <circle cx="26.375" cy="8.375" r="1.375" fill="currentColor"/>
  </g>
</svg>
